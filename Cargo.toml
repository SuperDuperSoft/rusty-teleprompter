[workspace]
members = ["crates/core", "crates/ui", "crates/companion"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusty-core = { path = "crates/core" }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "s"
panic = "abort"

